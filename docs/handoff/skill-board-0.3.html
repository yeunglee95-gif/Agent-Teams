<title>Dev Team Skill Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a wiring diagram. Roles are connectors on the left, skills are parts on the right,
   wires show which role loads which skill; a details strip reads out the selected part. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1c2320; --muted: #5d6964; --line: #d3d9d4;
  --accent: #2a5bd7; --accent-soft: #e3eafb; --wire: #b9c2bd; --warn: #b45309; --warn-soft: #fdf0e1;
  --c-obra: #7c3aed; --c-anthropics: #b4532a; --c-mattpocock: #0f766e; --c-addyosmani: #a21caf; --c-EricTechPro: #1d4ed8; --c-own: #4b5563;
  --display: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --surface: #191e1c; --ink: #e4e9e6; --muted: #97a29d; --line: #2b3330;
  --accent: #86a6ff; --accent-soft: #1d2740; --wire: #3a4440; --warn: #f0a35c; --warn-soft: #2f2416;
  --c-obra: #b69bff; --c-anthropics: #ec8f62; --c-mattpocock: #4fd1c0; --c-addyosmani: #e48ae9; --c-EricTechPro: #7fa6ff; --c-own: #aab3b0;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111513; --surface: #191e1c; --ink: #e4e9e6; --muted: #97a29d; --line: #2b3330;
  --accent: #86a6ff; --accent-soft: #1d2740; --wire: #3a4440; --warn: #f0a35c; --warn-soft: #2f2416;
  --c-obra: #b69bff; --c-anthropics: #ec8f62; --c-mattpocock: #4fd1c0; --c-addyosmani: #e48ae9; --c-EricTechPro: #7fa6ff; --c-own: #aab3b0;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; }
header { display: grid; gap: 6px; margin-bottom: 20px; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(30px, 5vw, 44px)/1.05 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); max-width: 68ch; margin: 0; }
.spec { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 13px var(--mono); color: var(--muted); margin-top: 6px; }
.spec b { color: var(--ink); font-weight: 500; }
.spec a { color: var(--accent); }
nav { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 20px; }
nav button { font: 600 15px var(--display); letter-spacing: .02em; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 12px 9px; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav button:focus-visible, .node:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav .count { font: 12px var(--mono); color: var(--muted); margin-left: 4px; }
nav .count.warn { color: var(--warn); }

/* Map */
.map { display: grid; grid-template-columns: minmax(0, 250px) minmax(60px, 1fr) minmax(0, 280px) minmax(0, 340px); gap: 0 0; align-items: start; position: relative; }
.col { display: grid; gap: 6px; position: relative; z-index: 1; }
.col h2, .details h2.k { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.node { display: grid; gap: 1px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; color: var(--ink); font: inherit; min-width: 0; transition: opacity .15s, border-color .15s; }
.node .n { font: 600 16px/1.2 var(--display); letter-spacing: .01em; overflow-wrap: anywhere; }
.node .m { font: 12px var(--mono); color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.role .n::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); margin-right: 7px; vertical-align: 2px; }
.node.sel { border-color: var(--accent); background: var(--accent-soft); }
.node.lit { border-color: var(--accent); }
.dim .node:not(.sel):not(.lit) { opacity: .35; }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.wires path { fill: none; stroke: var(--wire); stroke-width: 1.2; transition: stroke .15s, opacity .15s; }
.dim .wires path { opacity: .18; }
.dim .wires path.on { opacity: 1; stroke: var(--accent); stroke-width: 2; }
.details { margin-left: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; display: grid; gap: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.details h3 { font: 700 24px/1.1 var(--display); margin: 0; overflow-wrap: anywhere; }
.details p { margin: 0; }
.details .lead { color: var(--muted); font-style: italic; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { font: 12px var(--mono); color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 13px var(--mono); border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 2px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.src { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; font-size: 13px; }
.src .r { font: 500 13px var(--mono); }
.src code, .mono { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
a { color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; }

/* Sources */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { font: 700 22px/1.1 var(--display); margin: 0; display: flex; gap: 8px; align-items: center; }
.card .lic { font: 12px var(--mono); color: var(--muted); }

/* Loop */
.loop { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; max-width: 900px; }
.loop li { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.loop .no { font: 700 26px/1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.loop .st { font: 700 19px/1.2 var(--display); margin: 0 0 4px; }
.loop .row { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 14px; }
.loop .row dt { font: 12px var(--mono); color: var(--muted); padding-top: 2px; }
td.nw { white-space: nowrap; }
.loop .row dd { margin: 0; min-width: 0; }
.loop li.owner .st { color: var(--accent); }

/* Tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.issues { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 12px 16px; color: var(--ink); }
.issues li { margin: 2px 0; }
.empty { color: var(--muted); }

@media (max-width: 1000px) {
  .map { grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr); }
  .details { grid-column: 1 / -1; margin: 18px 0 0; position: static; max-height: none; }
}
@media (max-width: 640px) {
  .map { grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); }
  .node { padding: 6px 8px; }
  .node .n { font-size: 14px; }
  .node .m { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const D = {"team": {"name": "dev-team", "version": "0.3.0", "description": "The shared core dev team: architect, owner, fixer, gate-runner, reviewer, spec-auditor, critic, security-reviewer, scribe and repo-auditor, with fourteen skills they load and one milestone loop they all follow. Each app keeps its own memory, specs, gate and specialists.", "repo": "yeunglee95-gif/agent-teams", "ref": "dev-team-0.3", "commit": "4312369d4bd112b5877d8717b0360f453c7515c6"}, "roles": [{"id": "architect", "what": "Writes and amends specs, plans a milestone, and owns the app's contract files. Use for anything that changes structure before a lane builds it, for a contracts step, and for the question a lane stops on. Never builds a feature.", "model": "opus", "tools": "", "skills": ["grill-the-plan", "slice-the-plan", "architecture-critique", "decision-record", "verify-before-done"], "path": "plugins/dev-team/agents/architect.md"}, {"id": "critic", "what": "Uses the built app as a first-time user with a named persona and writes a gauntlet report with screenshots. Use for each gauntlet round. Never reads the code first, never fixes.", "model": "opus", "tools": "", "skills": ["verify-before-done"], "path": "plugins/dev-team/agents/critic.md"}, {"id": "fixer", "what": "Fixes findings from a review, a security review or a gauntlet round, each with a test that fails first, and also takes single bounded fixes from a precise brief. Use after a review or critic report, or for one mechanical fix. Owns the cause, not the symptom.", "model": "opus", "tools": "", "skills": ["weigh-review-findings", "root-cause-debugging", "tests-first", "verify-before-done"], "path": "plugins/dev-team/agents/fixer.md"}, {"id": "gate-runner", "what": "Runs the app's full gate and reports numbers, fixing only what it can prove is the harness. Use after a lane or a round reports, before any review. Never merges, never deploys, never settles a red.", "model": "sonnet", "tools": "", "skills": ["verify-before-done", "no-quiet-lowering", "release-checklist"], "path": "plugins/dev-team/agents/gate-runner.md"}, {"id": "owner", "what": "Owns one lane of a milestone with judgement, building against red tests that already exist. Use for anything cross-cutting or needing a decision inside its files. Never touches another lane's files or a frozen contract.", "model": "opus", "tools": "", "skills": ["tests-first", "verify-before-done"], "path": "plugins/dev-team/agents/owner.md"}, {"id": "repo-auditor", "what": "Audits code the team did not build, from one repo to a set of small repos that make one flow, and writes an inventory, a diagram of how the parts connect, a debt score and a plan to merge, retire or keep each part. Use before the team takes over, cleans up or consolidates someone else's code. Read-only; never edits, moves or deletes anything.", "model": "opus", "tools": "Read, Glob, Grep, Bash", "skills": ["repo-audit", "architecture-critique", "verify-before-done"], "path": "plugins/dev-team/agents/repo-auditor.md"}, {"id": "reviewer", "what": "Reviews a milestone's work independently of its builders, forming its own hypotheses before reading any builder's report, for functionality, visual quality and accessibility, and writes the verified-fixed table after the fix pass. Also reviews the architect's plans and the repo-auditor's consolidation plans before anyone builds. Use before a plan is built and before anything is called done. Never fixes.", "model": "opus", "tools": "", "skills": ["verify-before-done", "hidden-failure-check", "no-quiet-lowering", "architecture-critique"], "path": "plugins/dev-team/agents/reviewer.md"}, {"id": "scribe", "what": "Keeps the app's memory file, roadmap, status board and any pilot scorecard current from what the agents actually produced. Owns the team's milestone loop page and runs the retro at each milestone close. Use at every milestone event (a pass starts or ends, a decision is made, a gate reports). Never invents a number, never applies its own retro proposals.", "model": "opus", "tools": "", "skills": ["run-retro", "claude-md-upkeep", "verify-before-done"], "path": "plugins/dev-team/agents/scribe.md"}, {"id": "security-reviewer", "what": "Reviews the branch for secrets, input handling, dependencies and the browser or system paths that touch files, the clipboard or the DOM. Use once per milestone after the feature wave, and on any dependency change. Never fixes.", "model": "opus", "tools": "", "skills": ["verify-before-done", "no-quiet-lowering"], "path": "plugins/dev-team/agents/security-reviewer.md"}, {"id": "spec-auditor", "what": "Runs the conformance sweep, one row per specified behavior, marking each Met, Missing or Partial against the built app, with a test-gap table that maps each row to the test that asserts it. Use once per milestone after the feature wave and before the first critic. Never fixes, never trusts a lane's report.", "model": "opus", "tools": "", "skills": ["verify-before-done", "hidden-failure-check"], "path": "plugins/dev-team/agents/spec-auditor.md"}], "skills": [{"id": "architecture-critique", "title": "Architecture critique", "what": "Use to review a plan before anyone builds it (a milestone or lane plan, a spec change, a consolidation plan from the repo-auditor), or to judge the shape of existing code. Skeptical by default; asks whether each part is needed, what the simplest design is, and what happens when a part fails. The architect may also use its design-it-twice step to compare several interfaces before choosing one.", "lead": "Default stance: skeptical. The plan's author is excited about it; your job is to ask \"do we need this?\" You review the plan, not the person, and you never rewrite the plan yourself.", "sources": [{"repo": "anthropics/claude-plugins-official", "path": "plugins/code-modernization/agents/architecture-critic.md", "commit": "b78ac49cdc6b3d7b61c4439470e311f4291265b1", "license": "Apache License 2.0"}, {"repo": "mattpocock/skills", "path": "skills/engineering/codebase-design (including DEEPENING.md and DESIGN-IT-TWICE.md)", "commit": "f3fc5632f401156837ee3872f14fe33ccf1024ea and 49dd158d1076134a641b33efb035946536778336 (folder unchanged between them)", "license": "MIT, Copyright (c) 2026 Matt Pocock"}], "authors": ["anthropics", "mattpocock"], "changed": "merged into one skill, rewritten in this team's voice, the modernization-specific lines removed, and options plus a recommendation required; the dependency kinds made one check line; design-it-twice made an optional step only the architect runs, with the reviewer limited to critique and a hard-to-reverse choice routed to a decision record.", "sourceText": "Adapted from the `architecture-critic` agent in Anthropic's `code-modernization` plugin (anthropics/claude-plugins-official, Apache License 2.0), commit b78ac49cdc6b3d7b61c4439470e311f4291265b1, and from the deletion test and seam rules in `codebase-design` in mattpocock/skills (MIT, Copyright (c) 2026 Matt Pocock), commit f3fc5632f401156837ee3872f14fe33ccf1024ea, with the dependency kinds from `skills/engineering/codebase-design/DEEPENING.md` and the design-it-twice step from `skills/engineering/codebase-design/DESIGN-IT-TWICE.md` taken at commit 49dd158d1076134a641b33efb035946536778336 (`git diff` shows `skills/engineering/codebase-design` unchanged between the two commits). Changed: merged into one skill, rewritten in this team's voice, the modernization-specific lines removed, and options plus a recommendation required; the dependency kinds made one check line; design-it-twice made an optional step only the architect runs, with the reviewer limited to critique and a hard-to-reverse choice routed to a decision record. License texts: `../../licenses/Apache-2.0.txt`, `../../licenses/mattpocock-skills-MIT.txt`.", "path": "plugins/dev-team/skills/architecture-critique/SKILL.md", "usedBy": ["architect", "repo-auditor", "reviewer"]}, {"id": "claude-md-upkeep", "title": "CLAUDE.md upkeep", "what": "Use at the close of a milestone, and whenever an agent stopped to ask because the app's CLAUDE.md did not say something. Audits each CLAUDE.md against the code, reports a score and proposed changes, and applies only the changes the owner approves.", "lead": "Every role reads the app's `CLAUDE.md` first. A stale one misleads the whole team at once, so it is kept current and short.", "sources": [{"repo": "anthropics/claude-plugins-official", "path": "plugins/claude-md-management/skills/claude-md-improver", "commit": "b78ac49cdc6b3d7b61c4439470e311f4291265b1", "license": "Apache License 2.0"}], "authors": ["anthropics"], "changed": "rewritten in this team's voice, the scoring tied to what this team's roles need from a `CLAUDE.md`, and the sources for additions named.", "sourceText": "Adapted from the `claude-md-improver` skill in Anthropic's `claude-md-management` plugin (anthropics/claude-plugins-official, Apache License 2.0), commit b78ac49cdc6b3d7b61c4439470e311f4291265b1. Changed: rewritten in this team's voice, the scoring tied to what this team's roles need from a `CLAUDE.md`, and the sources for additions named. License text: `../../licenses/Apache-2.0.txt`.", "path": "plugins/dev-team/skills/claude-md-upkeep/SKILL.md", "usedBy": ["scribe"]}, {"id": "decision-record", "title": "Decision record", "what": "Use when a technical choice will be hard to undo (a framework, a data store, an outside service, a repo split or merge, a contract shape). Writes the decision record the owner signs: the options, the trade-offs, the choice, and what it makes harder later.", "lead": "Write one when a choice would cost a day or more to reverse. Small choices go in the memory file as a one-line decision, not a record.", "sources": [{"repo": "anthropics/knowledge-work-plugins", "path": "engineering/skills/architecture", "commit": "8444efcd48f7012f09797778a36a33e73d0861f4", "license": "Apache License 2.0"}], "authors": ["anthropics"], "changed": "rewritten in this team's voice, a recommendation section added, the owner's sign-off and supersede rules added.", "sourceText": "Adapted from the decision record format in the `architecture` skill of Anthropic's `engineering` plugin (anthropics/knowledge-work-plugins, Apache License 2.0), commit 8444efcd48f7012f09797778a36a33e73d0861f4. Changed: rewritten in this team's voice, a recommendation section added, the owner's sign-off and supersede rules added. License text: `../../licenses/Apache-2.0.txt`.", "path": "plugins/dev-team/skills/decision-record/SKILL.md", "usedBy": ["architect"]}, {"id": "grill-the-plan", "title": "Grill the plan", "what": "Use before writing a milestone plan, a spec change or a contract change, whenever the owner's request leaves decisions open. Interviews the owner in short rounds until no decision is left open; looks up every fact itself; writes nothing into a plan until the owner confirms. Keeps the app's glossary current as terms settle.", "lead": "A plan built on a guessed decision is rebuilt later at a higher price. Before you write a plan, find every open decision and put it to the owner, with your recommendation, until none is left.", "sources": [{"repo": "mattpocock/skills", "path": "skills/productivity/grilling and skills/engineering/domain-modeling", "commit": "49dd158d1076134a641b33efb035946536778336", "license": "MIT, Copyright (c) 2026 Matt Pocock"}], "authors": ["mattpocock"], "changed": "merged into one skill and rewritten in this team's voice; the user is the owner; at most four questions a round; answers logged in the memory file; the glossary goes to the one file the app's `CLAUDE.md` names instead of a `GLOSSARY.md` the skill creates; domain-modeling's ADR format not taken, only its three-part test, with records written through the `decision-record` skill; nothing written into a plan until the owner confirms.", "sourceText": "Adapted from `skills/productivity/grilling/SKILL.md` and `skills/engineering/domain-modeling/SKILL.md` in mattpocock/skills (MIT, Copyright (c) 2026 Matt Pocock), commit 49dd158d1076134a641b33efb035946536778336. Changed: merged into one skill and rewritten in this team's voice; the user is the owner; at most four questions a round; answers logged in the memory file; the glossary goes to the one file the app's `CLAUDE.md` names instead of a `GLOSSARY.md` the skill creates; domain-modeling's ADR format not taken, only its three-part test, with records written through the `decision-record` skill; nothing written into a plan until the owner confirms. License text: `../../licenses/mattpocock-skills-MIT.txt`.", "path": "plugins/dev-team/skills/grill-the-plan/SKILL.md", "usedBy": ["architect"]}, {"id": "hidden-failure-check", "title": "Hidden-failure check", "what": "Use when reviewing a change, and in the spec-auditor's sweep. Write your own hypotheses from the spec and the raw diff before reading the builder's report; find errors that fail quietly; build the test-gap table (each spec row to the test that asserts it, edge cases with exact values, ranked High, Medium, Low); label every finding by class and axis; on a re-review, re-check earlier findings by id first.", "lead": "Two questions for every change: does anything fail without telling anyone, and would the tests notice if the feature broke? A builder's report answers neither; it is a lead, never evidence.", "sources": [{"repo": "anthropics/claude-plugins-official", "path": "plugins/pr-review-toolkit/agents/silent-failure-hunter.md and pr-test-analyzer.md", "commit": "b78ac49cdc6b3d7b61c4439470e311f4291265b1", "license": "Apache License 2.0"}, {"repo": "EricTechPro/super-board", "path": "skills/super-review/SKILL.md and skills/super-qa/SKILL.md", "commit": "35e215615c98fa5da011368e764f38f86959bf95", "license": "MIT, Copyright (c) 2026 Eric Tech"}, {"repo": "mattpocock/skills", "path": "skills/engineering/code-review and skills/engineering/tdd", "commit": "49dd158d1076134a641b33efb035946536778336", "license": "MIT, Copyright (c) 2026 Matt Pocock"}], "authors": ["EricTechPro", "anthropics", "mattpocock"], "changed": "merged into one skill and rewritten in this team's voice; severities mapped to this team's blocker, major and minor; the mutation check added. From super-board: hypotheses before the builder's report, the five finding classes with over-engineering never blocking alone, re-checking earlier findings by id, and the test-gap table, with acceptance criteria read as spec rows; not taken: the GitHub report comment, the ponytail plugin, routing to lanes by PR thread, filing refactor cards straight to Ready, the \"if the user authorizes, fix\" clause, and writing the High-gap tests (this team's fixer writes them). From code-review: the two axes kept apart and never reranked, and the smell baseline as judgment calls; the parallel sub-agents and tracker lookup not taken.", "sourceText": "Adapted from three sources: - The `silent-failure-hunter` and `pr-test-analyzer` agents in Anthropic's `pr-review-toolkit` plugin (anthropics/claude-plugins-official, Apache License 2.0), commit b78ac49cdc6b3d7b61c4439470e311f4291265b1. License text: `../../licenses/Apache-2.0.txt`. - `skills/super-review/SKILL.md` (review flow steps 2 and 3, \"Review remembers\") and `skills/super-qa/SKILL.md` (\"Test-gap check (after build)\") in EricTechPro/super-board (MIT, Copyright (c) 2026 Eric Tech), commit 35e215615c98fa5da011368e764f38f86959bf95. License text: `../../licenses/erictechpro-super-board-MIT.txt`. - `skills/engineering/code-review/SKILL.md` (the two axes and the smell baseline) and the tautological-test anti-pattern in `skills/engineering/tdd/SKILL.md` in mattpocock/skills (MIT, Copyright (c) 2026 Matt Pocock), commit 49dd158d1076134a641b33efb035946536778336. License text: `../../licenses/mattpocock-skills-MIT.txt`. Changed: merged into one skill and rewritten in this team's voice; severities mapped to this team's blocker, major and minor; the mutation check added. From super-board: hypotheses before the builder's report, the five finding classes with over-engineering never blocking alone, re-checking earlier findings by id, and the test-gap table, with acceptance criteria read as spec rows; not taken: the GitHub report comment, the ponytail plugin, routing to lanes by PR thread, filing refactor cards straight to Ready, the \"if the user authorizes, fix\" clause, and writing the High-gap tests (this team's fixer writes them). From code-review: the two axes kept apart and never reranked, and the smell baseline as judgment calls; the parallel sub-agents and tracker lookup not taken.", "path": "plugins/dev-team/skills/hidden-failure-check/SKILL.md", "usedBy": ["reviewer", "spec-auditor"]}, {"id": "no-quiet-lowering", "title": "No quiet lowering", "what": "Use when running the gate or reviewing a diff, to catch a quality bar lowered on the way to green. Checks the diff since the branch point for moved thresholds, easier or skipped tests, silenced checkers, unfinished stubs and new exceptions.", "lead": "An agent that hits a red check takes the cheapest road to green. The cheapest road is usually to lower the bar, not to fix the code. Tightening a bar can be silent; loosening one must be loud.", "sources": [{"repo": "addyosmani/agent-skills", "path": "skills/constraint-driven-development (Step 6)", "commit": "1401c8b8030e023baeebb31781a6653fe8e93026", "license": "MIT, Copyright (c) 2025 Addy Osmani"}], "authors": ["addyosmani"], "changed": "only the diff guard is taken (not the CONSTRAINTS.md interview or tool installs), rewritten in this team's voice, and tied to the memory file for exceptions.", "sourceText": "Adapted from Step 6, \"Guard the bar itself\", of `constraint-driven-development` in addyosmani/agent-skills (MIT, Copyright (c) 2025 Addy Osmani), commit 1401c8b8030e023baeebb31781a6653fe8e93026. Changed: only the diff guard is taken (not the CONSTRAINTS.md interview or tool installs), rewritten in this team's voice, and tied to the memory file for exceptions. License text: `../../licenses/addyosmani-agent-skills-MIT.txt`.", "path": "plugins/dev-team/skills/no-quiet-lowering/SKILL.md", "usedBy": ["gate-runner", "reviewer", "security-reviewer"]}, {"id": "release-checklist", "title": "Release checklist", "what": "Use when a milestone is ready to merge to the main branch, or to go past staging or live. Prepares the release checklist, the merge-danger call, the merge-gate lines and the rollback triggers for the owner to sign. Never merges or releases anything itself.", "lead": "You prepare the checklist. The owner gives the go. Releasing, merging to the main branch, tagging and deploying are Red-tier actions in the app's `CLAUDE.md`, and each one waits for the owner's explicit proceed.", "sources": [{"repo": "anthropics/knowledge-work-plugins", "path": "engineering/skills/deploy-checklist", "commit": "8444efcd48f7012f09797778a36a33e73d0861f4", "license": "Apache License 2.0"}, {"repo": "mattpocock/skills", "path": "skills/engineering/pr (Merge Danger)", "commit": "49dd158d1076134a641b33efb035946536778336", "license": "MIT, Copyright (c) 2026 Matt Pocock"}, {"repo": "EricTechPro/super-board", "path": "skills/super-review/SKILL.md (merge protocol)", "commit": "35e215615c98fa5da011368e764f38f86959bf95", "license": "MIT, Copyright (c) 2026 Eric Tech"}], "authors": ["EricTechPro", "anthropics", "mattpocock"], "changed": "rewritten in this team's voice, tied to the team's gate, reviews and Red-tier rule, on-call and ticket steps removed. From pr: only the one-way or two-way door and blast radius, as two lines for the owner. From super-board: the merge gate's checks (reviewed head is the merged head, base merged in and gate green on it, merge commit confirmed on the base) as lines the owner signs; its automatic merge, merge policy and the merge when CI failed to start are not taken. The analytics-events line is this team's own, from the owner's 2026-10-10 scope.", "sourceText": "Adapted from three sources: - The `deploy-checklist` skill in Anthropic's `engineering` plugin (anthropics/knowledge-work-plugins, Apache License 2.0), commit 8444efcd48f7012f09797778a36a33e73d0861f4. License text: `../../licenses/Apache-2.0.txt`. - The Merge Danger section of `skills/engineering/pr/SKILL.md` in mattpocock/skills (MIT, Copyright (c) 2026 Matt Pocock), commit 49dd158d1076134a641b33efb035946536778336. License text: `../../licenses/mattpocock-skills-MIT.txt`. - The merge protocol in `skills/super-review/SKILL.md` (\"Merge protocol: Done means merged\") in EricTechPro/super-board (MIT, Copyright (c) 2026 Eric Tech), commit 35e215615c98fa5da011368e764f38f86959bf95. License text: `../../licenses/erictechpro-super-board-MIT.txt`. Changed: rewritten in this team's voice, tied to the team's gate, reviews and Red-tier rule, on-call and ticket steps removed. From pr: only the one-way or two-way door and blast radius, as two lines for the owner. From super-board: the merge gate's checks (reviewed head is the merged head, base merged in and gate green on it, merge commit confirmed on the base) as lines the owner signs; its automatic merge, merge policy and the merge when CI failed to start are not taken. The analytics-events line is this team's own, from the owner's 2026-10-10 scope.", "path": "plugins/dev-team/skills/release-checklist/SKILL.md", "usedBy": ["gate-runner"]}, {"id": "repo-audit", "title": "Repo audit", "what": "Use to understand code the team did not build, from one repo to a set of small repos that together make one flow. Produces an inventory with every claim cited to a file and line, a diagram of how the parts connect, a debt score, and a safe order to merge, retire or keep each part.", "lead": "Your job is understanding first, judgment second. The code works for somebody today, however messy it looks. Find out what it does before you say what should change.", "sources": [{"repo": "anthropics/claude-plugins-official", "path": "plugins/code-modernization/agents/legacy-analyst.md and commands/modernize-assess.md", "commit": "b78ac49cdc6b3d7b61c4439470e311f4291265b1", "license": "Apache License 2.0"}, {"repo": "anthropics/knowledge-work-plugins", "path": "engineering/skills/tech-debt", "commit": "8444efcd48f7012f09797778a36a33e73d0861f4", "license": "Apache License 2.0"}, {"repo": "addyosmani/agent-skills", "path": "skills/deprecation-and-migration", "commit": "1401c8b8030e023baeebb31781a6653fe8e93026", "license": "MIT, Copyright (c) 2025 Addy Osmani"}], "authors": ["addyosmani", "anthropics"], "changed": "combined into one method for a set of small repos, rewritten in this team's voice, legacy-language and COCOMO material removed.", "sourceText": "Adapted from the `legacy-analyst` agent and the portfolio mode of the `modernize-assess` command in Anthropic's `code-modernization` plugin (anthropics/claude-plugins-official, Apache License 2.0), commit b78ac49cdc6b3d7b61c4439470e311f4291265b1; the tech-debt scoring in Anthropic's `engineering` plugin (anthropics/knowledge-work-plugins, Apache License 2.0), commit 8444efcd48f7012f09797778a36a33e73d0861f4; and the migration steps in `deprecation-and-migration` in addyosmani/agent-skills (MIT, Copyright (c) 2025 Addy Osmani), commit 1401c8b8030e023baeebb31781a6653fe8e93026. Changed: combined into one method for a set of small repos, rewritten in this team's voice, legacy-language and COCOMO material removed. License texts: `../../licenses/Apache-2.0.txt`, `../../licenses/addyosmani-agent-skills-MIT.txt`.", "path": "plugins/dev-team/skills/repo-audit/SKILL.md", "usedBy": ["repo-auditor"]}, {"id": "root-cause-debugging", "title": "Root-cause debugging", "what": "Use for any bug, failing test, red gate or behavior that differs from the spec, before proposing a fix. First build one fast command that shows the bug red; then rank several hypotheses and prove the cause; fix the cause, not the symptom; stop after three failed fixes and question the design.", "lead": "No fix before the cause is found. A fix aimed at a symptom moves the bug somewhere else.", "sources": [{"repo": "obra/superpowers", "path": "skills/systematic-debugging", "commit": "8ca22dba9a94f28898bbce59f2537ff4d87c747d", "license": "MIT, Copyright (c) 2025 Jesse Vincent"}, {"repo": "mattpocock/skills", "path": "skills/engineering/diagnosing-bugs", "commit": "49dd158d1076134a641b33efb035946536778336", "license": "MIT, Copyright (c) 2026 Matt Pocock"}], "authors": ["mattpocock", "obra"], "changed": "shortened and rewritten in this team's voice; diagnosing-bugs' feedback-loop phase made step 1 (one red, deterministic, fast command, run before any hypothesis), with its ranked falsifiable hypotheses, tagged debug logs removed by grep, and \"no correct seam is itself a finding\"; its human-in-the-loop script and phase numbering not taken; the escalation pointed at the architect; the team's three-strikes and no-retry rules kept.", "sourceText": "Adapted from two sources: - `systematic-debugging` in obra/superpowers (MIT, Copyright (c) 2025 Jesse Vincent), commit 8ca22dba9a94f28898bbce59f2537ff4d87c747d. License text: `../../licenses/obra-superpowers-MIT.txt`. - `skills/engineering/diagnosing-bugs/SKILL.md` in mattpocock/skills (MIT, Copyright (c) 2026 Matt Pocock), commit 49dd158d1076134a641b33efb035946536778336. License text: `../../licenses/mattpocock-skills-MIT.txt`. Changed: shortened and rewritten in this team's voice; diagnosing-bugs' feedback-loop phase made step 1 (one red, deterministic, fast command, run before any hypothesis), with its ranked falsifiable hypotheses, tagged debug logs removed by grep, and \"no correct seam is itself a finding\"; its human-in-the-loop script and phase numbering not taken; the escalation pointed at the architect; the team's three-strikes and no-retry rules kept.", "path": "plugins/dev-team/skills/root-cause-debugging/SKILL.md", "usedBy": ["fixer"]}, {"id": "run-retro", "title": "Run retro", "what": "Use at the close of every milestone, after the owner's go or stop. Reads what went wrong in the milestone (review findings, fixes, gate failures, critic reports, the owner's rejections) and writes a proposal list for the owner, preferring a deterministic check over more prose. Proposes only; never edits a skill, hook or CLAUDE.md itself.", "lead": "The team gets better between milestones, not during one. A retro turns this milestone's misses into proposals the owner approves or rejects, one by one. Nothing changes until the owner says yes, and then it ships as a new team version or a `CLAUDE.md` edit the owner approved.", "sources": [{"repo": "mattpocock/skills", "path": "skills/engineering/retro", "commit": "49dd158d1076134a641b33efb035946536778336", "license": "MIT, Copyright (c) 2026 Matt Pocock"}], "authors": ["mattpocock"], "changed": "rewritten in this team's voice; the input is the milestone's own finding, fixer, gate, critic and owner records instead of session logs; \"review agent\" mapped to this team's reviewer and \"automated checks\" to the gate-runner's gate; a class seen in two milestones must produce a proposal; output is a proposal list the owner approves item by item, never an edit; the `writing-for-agents` step and the tool-economy and no-op sections shortened to one line each.", "sourceText": "Adapted from `skills/engineering/retro/SKILL.md` in mattpocock/skills (MIT, Copyright (c) 2026 Matt Pocock), commit 49dd158d1076134a641b33efb035946536778336. Changed: rewritten in this team's voice; the input is the milestone's own finding, fixer, gate, critic and owner records instead of session logs; \"review agent\" mapped to this team's reviewer and \"automated checks\" to the gate-runner's gate; a class seen in two milestones must produce a proposal; output is a proposal list the owner approves item by item, never an edit; the `writing-for-agents` step and the tool-economy and no-op sections shortened to one line each. License text: `../../licenses/mattpocock-skills-MIT.txt`.", "path": "plugins/dev-team/skills/run-retro/SKILL.md", "usedBy": ["scribe"]}, {"id": "slice-the-plan", "title": "Slice the plan", "what": "Use when turning an agreed plan or spec into lanes for a milestone. Cuts the work into thin vertical slices, each a lane with its own files and named red tests, orders lanes by what blocks what, sequences wide refactors as expand then migrate then contract, and has the owner check the breakdown before any lane starts.", "lead": "Run this after the `grill-the-plan` skill has closed every open decision. The output is the lane plan the architect owns.", "sources": [{"repo": "mattpocock/skills", "path": "skills/engineering/to-tickets", "commit": "49dd158d1076134a641b33efb035946536778336", "license": "MIT, Copyright (c) 2026 Matt Pocock"}], "authors": ["mattpocock"], "changed": "rewritten in this team's voice; tickets became lanes with disjoint file ownership and named red tests; blocking edges became lane order; the quiz step goes to the owner; the reviewer's plan critique added before lanes start; publishing to a tracker only when the app's `CLAUDE.md` names one, never with a ready-for-agent label; the setup-skill pointer and ticket templates removed.", "sourceText": "Adapted from `skills/engineering/to-tickets/SKILL.md` in mattpocock/skills (MIT, Copyright (c) 2026 Matt Pocock), commit 49dd158d1076134a641b33efb035946536778336. Changed: rewritten in this team's voice; tickets became lanes with disjoint file ownership and named red tests; blocking edges became lane order; the quiz step goes to the owner; the reviewer's plan critique added before lanes start; publishing to a tracker only when the app's `CLAUDE.md` names one, never with a ready-for-agent label; the setup-skill pointer and ticket templates removed. License text: `../../licenses/mattpocock-skills-MIT.txt`.", "path": "plugins/dev-team/skills/slice-the-plan/SKILL.md", "usedBy": ["architect"]}, {"id": "tests-first", "title": "Tests first", "what": "Use before writing any feature, fix or behavior change in app code. Write one failing test, watch it fail for the right reason, write the least code that turns it green, then clean up with the suite still green.", "lead": "If you did not watch the test fail, you do not know it tests the right thing.", "sources": [{"repo": "obra/superpowers", "path": "skills/test-driven-development", "commit": "8ca22dba9a94f28898bbce59f2537ff4d87c747d", "license": "MIT, Copyright (c) 2025 Jesse Vincent"}, {"repo": "mattpocock/skills", "path": "skills/engineering/tdd (anti-patterns only)", "commit": "49dd158d1076134a641b33efb035946536778336", "license": "MIT, Copyright (c) 2026 Matt Pocock"}], "authors": ["mattpocock", "obra"], "changed": "shortened, rewritten in this team's voice, and the section on the architect's red tests added so the skill matches the lane plan; from tdd, only the tautological and horizontal-slicing anti-patterns, with its \"confirm seams with the user\" step left out because the architect's lane plan names the red tests.", "sourceText": "Adapted from `test-driven-development` in obra/superpowers (MIT, Copyright (c) 2025 Jesse Vincent), commit 8ca22dba9a94f28898bbce59f2537ff4d87c747d, with the two named anti-patterns from `skills/engineering/tdd/SKILL.md` in mattpocock/skills (MIT, Copyright (c) 2026 Matt Pocock), commit 49dd158d1076134a641b33efb035946536778336. Changed: shortened, rewritten in this team's voice, and the section on the architect's red tests added so the skill matches the lane plan; from tdd, only the tautological and horizontal-slicing anti-patterns, with its \"confirm seams with the user\" step left out because the architect's lane plan names the red tests. License texts: `../../licenses/obra-superpowers-MIT.txt`, `../../licenses/mattpocock-skills-MIT.txt`.", "path": "plugins/dev-team/skills/tests-first/SKILL.md", "usedBy": ["fixer", "owner"]}, {"id": "verify-before-done", "title": "Verify before done", "what": "Use before saying anything is done, fixed, passing, green or clean, before a commit, and before reporting another agent's work as finished. Requires fresh evidence from a check run in this turn; a claim without it is not made.", "lead": "No claim of done, fixed, passing, green or clean without fresh evidence from this turn. A check you ran earlier, a check another agent says it ran, and \"it should pass now\" are not evidence.", "sources": [{"repo": "obra/superpowers", "path": "skills/verification-before-completion", "commit": "8ca22dba9a94f28898bbce59f2537ff4d87c747d", "license": "MIT, Copyright (c) 2025 Jesse Vincent"}], "authors": ["obra"], "changed": "rewritten in this team's voice, the table extended with the spec and critic rows, PR and push wording removed.", "sourceText": "Adapted from `verification-before-completion` in obra/superpowers (MIT, Copyright (c) 2025 Jesse Vincent), commit 8ca22dba9a94f28898bbce59f2537ff4d87c747d. Changed: rewritten in this team's voice, the table extended with the spec and critic rows, PR and push wording removed. License text: `../../licenses/obra-superpowers-MIT.txt`.", "path": "plugins/dev-team/skills/verify-before-done/SKILL.md", "usedBy": ["architect", "critic", "fixer", "gate-runner", "owner", "repo-auditor", "reviewer", "scribe", "security-reviewer", "spec-auditor"]}, {"id": "weigh-review-findings", "title": "Weigh review findings", "what": "Use when taking findings from a review, a security review, a critic report or the owner, before changing any code. Check each finding against the code, ask about unclear ones first, push back with evidence when one is wrong, then fix one at a time.", "lead": "A finding is a claim to check, not an order to obey. Check it against the code before acting.", "sources": [{"repo": "obra/superpowers", "path": "skills/receiving-code-review", "commit": "8ca22dba9a94f28898bbce59f2537ff4d87c747d", "license": "MIT, Copyright (c) 2025 Jesse Vincent"}], "authors": ["obra"], "changed": "shortened, rewritten in this team's voice, pointed at the team's roles and memory file, GitHub reply steps removed.", "sourceText": "Adapted from `receiving-code-
