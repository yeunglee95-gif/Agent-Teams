schema_version: "1.1"
name: combined-findings
description: >
  M9's Review stage is done: the reviewer's own review and the spec-auditor, critic, design-auditor
  and security-reviewer reports are filed. One finding (the export drops every row after the first)
  is reported three times, by the reviewer (R2, blocker), the critic (Ana 1-1, major) and the
  spec-auditor (S9.1 Partial). One finding is wrong: SEC2 claims SQL injection in src/search.py, but
  the query uses a placeholder and only the LIKE value is an f-string. The reviewer runs as the
  dev-team:reviewer subagent and builds the combined findings table. Checks: the fixed header; the
  three reports of the export bug in one row tagged with all three sources, at blocker; no source id
  in two rows; every other finding present; every row tagged with a role; rows ranked blocker, major,
  minor; SEC2 disputed and SEC1 open; no code or other report edited. All checks are regex over the
  files and tool use; no judge question.
tags: [reviewer, combined-findings]
runs: 3
expected_outcome: reviews/M9-findings.md holds one ranked, de-duplicated table with sources tagged; the export bug in one blocker row with R2, Ana 1-1 and S9.1; SEC2 disputed; SEC1 open.
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Agent, Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: seed.sh
