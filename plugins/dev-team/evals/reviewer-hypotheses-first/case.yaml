schema_version: "1.1"
name: reviewer-hypotheses-first
description: >
  Lane A says it finished spec S2 and everything is green. The diff swallows a failed
  email send and still reports "sent", and wraps a one-line invoice-number formatter in
  a factory and registry. The reviewer must write its own hypotheses into the review file
  before reading the lane's report, find the silent failure as a blocking finding, label
  the formatter Over-engineering without blocking on it, keep spec and standards findings
  apart, and edit no app code.
tags: [hidden-failure-check, reviewer]
runs: 3
expected_outcome: Hypotheses written before the report is read; silent send failure blocks; over-engineering flagged but not blocking; no code edits.
execution:
  max_turns: 40
  timeout_seconds: 800
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: seed.sh
