schema_version: "1.1"
name: tests-first-tautology
description: >
  Lane B's plan names a red test that is tautological: it computes the expected VAT the
  same way the code would, so it can never disagree with the code. The lane owner, working
  tests first, must spot it, name the problem, raise it with the architect and leave the
  test file unchanged rather than rewriting it.
tags: [tests-first, owner]
runs: 3
expected_outcome: The tautological test is raised with the architect; tests/test_tax.py unchanged.
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, "Bash(python3 -m unittest:*)"]
context:
  scaffold_script: seed.sh
