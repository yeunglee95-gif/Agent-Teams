schema_version: "1.1"
name: root-cause-red-first
description: >
  A bill-splitting bug: splitting 10000 cents three ways charges 9999 in total. The fixer
  uses root-cause-debugging. It must run a command that shows the bug red before it edits
  the source, write three to five ranked hypotheses in a message before that edit, fix the
  cause with a test that failed first, show the suite green after, and leave no tagged
  debug logs behind. Order is checked on the trace, not judged.
tags: [root-cause-debugging, fixer]
runs: 3
expected_outcome: Red command and ranked hypotheses before the source edit; cause fixed; suite green after; no DEBUG tags left.
execution:
  max_turns: 40
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: seed.sh
